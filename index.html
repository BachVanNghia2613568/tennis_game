<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Badminton Game</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #10243a;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    color: #00ffc3;
    margin: 25px 0 10px;
}

.score {
    font-size: 32px;
    font-weight: bold;
    margin: 15px;
}

#court {
    width: min(90%, 800px);
    height: 420px;
    margin: 20px auto;
    background: #079b68;
    border: 5px solid white;
    position: relative;
    overflow: hidden;
}

#net {
    position: absolute;
    left: 50%;
    height: 100%;
    border-left: 4px dashed white;
}

.player {
    position: absolute;
    font-size: 42px;
    transform: translate(-50%, -50%);
    z-index: 2;
}

#p1 { left: 9%; top: 50%; }
#p2 { left: 91%; top: 50%; }

#shuttle {
    position: absolute;
    left: 50%;
    top: 50%;
    font-size: 30px;
    transform: translate(-50%, -50%);
    z-index: 3;
}

button {
    background: #00ffc3;
    color: #10243a;
    border: none;
    border-radius: 10px;
    padding: 14px 35px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

button:hover { background: white; }

#message {
    margin: 15px;
    font-size: 19px;
}

.guide {
    margin: 15px;
    color: #d5e8e8;
}
</style>
</head>

<body>

<h1>TENNIS GAME</h1>

<div class="score">
    <span id="s1">0</span> - <span id="s2">0</span>
</div>

<div id="court">
    <div id="net"></div>
    <div class="player" id="p1">p1</div>
    <div class="player" id="p2">p2</div>
    <div id="shuttle">o</div>
</div>

<button id="startBtn">START GAME</button>

<div id="message">Nhan START GAME de bat dau!</div>

<div class="guide">
    W: Di chuyen len | S: Di chuyen xuong<br>
    SPACE: Danh cau
</div>

<script>
const court = document.getElementById("court");
const p1 = document.getElementById("p1");
const p2 = document.getElementById("p2");
const shuttle = document.getElementById("shuttle");
const startBtn = document.getElementById("startBtn");

let y1 = 210;
let y2 = 210;
let x = 400;
let y = 210;
let vx = 0;
let vy = 0;

let score1 = 0;
let score2 = 0;
let running = false;
let keys = {};

let lastTime = 0;
let animationId = null;

function resetBall() {
    x = 400;
    y = 210;
    vx = Math.random() < 0.5 ? 4 : -4;
    vy = Math.random() * 4 - 2;
}

function startGame() {
    score1 = 0;
    score2 = 0;
    y1 = 210;
    y2 = 210;

    document.getElementById("s1").textContent = 0;
    document.getElementById("s2").textContent = 0;

    resetBall();

    running = true;
    lastTime = 0;

    document.getElementById("message").textContent =
        "Tran dau dang dien ra!";

    startBtn.textContent = "CHOI LAI";

    if (!animationId) {
        animationId = requestAnimationFrame(gameLoop);
    }
}

startBtn.addEventListener("click", startGame);

document.addEventListener("keydown", function(e) {
keys[e.code] = true;
    if (e.code === "Space") e.preventDefault();
});

document.addEventListener("keyup", function(e) {
    keys[e.code] = false;
});

function update() {
    if (!running) return;

    if (keys["KeyW"]) y1 -= 5;
    if (keys["KeyS"]) y1 += 5;

    y1 = Math.max(25, Math.min(395, y1));

    // May di chuyen theo qua cau
    if (y2 < y) y2 += 3;
    if (y2 > y) y2 -= 3;

    // Qua cau di chuyen
    x += vx;
    y += vy;

    if (y < 15 || y > 405) vy *= -1;

    // Vot nguoi choi
    if (vx < 0 && x < 100 && x > 45 &&
        Math.abs(y - y1) < 65) {
        vx = 6;
        vy = (y - y1) * 0.12;
    }

    // Vot may
    if (vx > 0 && x > 700 && x < 755 &&
        Math.abs(y - y2) < 65) {
        vx = -6;
        vy = (y - y2) * 0.12;
    }

    // Danh cau bang SPACE
    if (keys["Space"] && vx < 0 && x < 160 &&
        Math.abs(y - y1) < 85) {
        vx = 7;
        vy = (y - y1) * 0.12;
        keys["Space"] = false;
    }

    // Tinh diem
    if (x < 0) {
        score2++;
        updateScore();
        checkWinner();
        resetBall();
    }

    if (x > 800) {
        score1++;
        updateScore();
        checkWinner();
        resetBall();
    }
}

function updateScore() {
    document.getElementById("s1").textContent = score1;
    document.getElementById("s2").textContent = score2;
}

function checkWinner() {
    if (score1 >= 21 || score2 >= 21) {
        running = false;

        document.getElementById("message").textContent =
            score1 > score2
            ? "CHUC MUNG! BAN DA THANG!"
            : "MAY DA CHIEN THANG!";
    }
}

function render() {
    p1.style.top = y1 + "px";
    p2.style.top = y2 + "px";

    shuttle.style.left = x + "px";
    shuttle.style.top = y + "px";
}

function gameLoop(time) {
    if (!running) {
        animationId = null;
        return;
    }

    if (!lastTime) lastTime = time;

    let steps = Math.min((time - lastTime) / 16.67, 2);
    lastTime = time;

    update();

    render();

    animationId = requestAnimationFrame(gameLoop);
}

render();
</script>

</body>
</html>
